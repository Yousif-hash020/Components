<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Scramble Button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
  }

  .scramble-btn {
    position: relative;
    padding: 18px 44px;
    font-size: 1.1rem;
    font-family: inherit;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: transparent;
    border: 2px solid #fff;
    border-radius: 4px;
    cursor: pointer;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .scramble-btn:hover {
    background: #fff;
    color: #0a0a0a;
  }

  .scramble-btn:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>

  <button class="scramble-btn" data-text="Explore Now">Explore Now</button>

<script>
  // Characters used while "scrambling" before letters settle on the real text
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*_-+=<>/\\';

  class TextScramble {
    constructor(el) {
      this.el = el;
      this.frame = 0;
      this.frameRequest = null;
      this.resolve = null;
    }

    setText(newText) {
      const oldText = this.el.textContent;
      const length = Math.max(oldText.length, newText.length);

      // build a queue describing, per character index: from -> to, plus a random
      // start/end frame so letters don't all settle at the same time
      this.queue = [];
      for (let i = 0; i < length; i++) {
        const from = oldText[i] || '';
        const to = newText[i] || '';
        const start = Math.floor(Math.random() * 20);
        const end = start + Math.floor(Math.random() * 20) + 10;
        this.queue.push({ from, to, start, end, char: null });
      }

      cancelAnimationFrame(this.frameRequest);
      this.frame = 0;

      return new Promise((resolve) => {
        this.resolve = resolve;
        this.update();
      });
    }

    update() {
      let output = '';
      let complete = 0;

      for (let i = 0; i < this.queue.length; i++) {
        let { from, to, start, end, char } = this.queue[i];

        if (this.frame >= end) {
          complete++;
          output += to;
        } else if (this.frame >= start) {
          // pick a new random character every couple of frames for a flicker feel
          if (!char || Math.random() < 0.28) {
            char = CHARS[Math.floor(Math.random() * CHARS.length)];
            this.queue[i].char = char;
          }
          output += `<span class="scramble-char">${char}</span>`;
        } else {
          output += from;
        }
      }

      this.el.innerHTML = output;

      if (complete === this.queue.length) {
        this.resolve();
      } else {
        this.frameRequest = requestAnimationFrame(() => {
          this.frame++;
          this.update();
        });
      }
    }
  }

  const btn = document.querySelector('.scramble-btn');
  const fx = new TextScramble(btn);
  const originalText = btn.dataset.text;

  // trigger the scramble on every mouse move over the button (re-scrambles while hovering),
  // but throttle so it doesn't restart on every single pixel of movement
  let lastTrigger = 0;
  btn.addEventListener('mousemove', () => {
    const now = Date.now();
    if (now - lastTrigger > 800) {
      lastTrigger = now;
      fx.setText(originalText);
    }
  });

  // also trigger once cleanly on mouse enter
  btn.addEventListener('mouseenter', () => {
    lastTrigger = Date.now();
    fx.setText(originalText);
  });
</script>

</body>
</html>
