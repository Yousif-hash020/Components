<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Stack Parallax</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
  }

  /* Fixed Navbar */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 40px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    z-index: 999; /* always on top of every section */
  }

  /* Push first section below navbar so it doesn't hide under it initially */
  .spacer {
    height: 70px;
  }

  section {
    position: sticky;
    top: 0;              /* sticks right under the very top of viewport */
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: #fff;
    font-weight: 700;
  }

  /* Each next section needs a higher stacking order so it slides OVER the previous one */
  section:nth-of-type(1) { background: #e63946; z-index: 1; }
  section:nth-of-type(2) { background: #1d3557; z-index: 2; }
  section:nth-of-type(3) { background: #2a9d8f; z-index: 3; }
  section:nth-of-type(4) { background: #f4a261; z-index: 4; }
  section:nth-of-type(5) { background: #6a4c93; z-index: 5; }
</style>
</head>
<body>

  <nav>MyBrand</nav>
  <div class="spacer"></div>

  <section>Section 1</section>
  <section>Section 2</section>
  <section>Section 3</section>
  <section>Section 4</section>
  <section>Section 5</section>

</body>
</html>
