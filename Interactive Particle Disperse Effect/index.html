<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Particle Reveal (No Blur)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }

  canvas {
    background: #0a0a0a;
    border-radius: 8px;
    cursor: none;
  }

  .hint {
    color: #888;
    margin-top: 16px;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .loading {
    color: #fff;
    font-size: 16px;
  }
</style>
</head>
<body>

  <div id="loadingText" class="loading">Loading image...</div>
  <canvas id="canvas" style="display:none;"></canvas>
  <div class="hint">Move your mouse over the image — dust particles scatter away, no blur, no blocky pixels</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const loadingText = document.getElementById('loadingText');

  // ---- CONFIG ----
  const IMG_SRC = 'https://picsum.photos/id/1005/500/500'; // <-- replace with your own image URL
  const PARTICLE_GAP = 3;      // spacing between particles (smaller = more detail, slower)
  const DOT_SIZE = 1.8;        // radius of each dot
  const MOUSE_RADIUS = 70;     // how far the "push" effect reaches
  const PUSH_DISTANCE = 22;    // how far particles get pushed away (in px)
  const EASE = 0.18;           // 0-1, higher = snappier/faster response, lower = smoother/slower

  let particles = [];
  let mouse = { x: -9999, y: -9999 };

  class Particle {
    constructor(x, y, color) {
      this.originX = x;
      this.originY = y;
      this.x = x;
      this.y = y;
      this.color = color;
    }

    update() {
      const dx = this.originX - mouse.x;
      const dy = this.originY - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let targetX = this.originX;
      let targetY = this.originY;

      if (dist < MOUSE_RADIUS) {
        // push target away from mouse, proportional to how close the mouse is
        const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
        const angle = Math.atan2(dy, dx);
        targetX = this.originX + Math.cos(angle) * force * PUSH_DISTANCE;
        targetY = this.originY + Math.sin(angle) * force * PUSH_DISTANCE;
      }

      // simple smooth lerp toward target — no velocity/overshoot, so no jiggle
      this.x += (targetX - this.x) * EASE;
      this.y += (targetY - this.y) * EASE;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, DOT_SIZE, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
  }

  function initParticles(img) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = img.width * dpr;
    canvas.height = img.height * dpr;
    canvas.style.width = img.width + 'px';
    canvas.style.height = img.height + 'px';
    ctx.scale(dpr, dpr);

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(img, 0, 0, img.width, img.height);
    const imageData = tempCtx.getImageData(0, 0, img.width, img.height).data;

    particles = [];
    for (let y = 0; y < img.height; y += PARTICLE_GAP) {
      for (let x = 0; x < img.width; x += PARTICLE_GAP) {
        const px = Math.floor(x);
        const py = Math.floor(y);
        const index = (py * img.width + px) * 4;
        const r = imageData[index];
        const g = imageData[index + 1];
        const b = imageData[index + 2];
        const alpha = imageData[index + 3];

        if (alpha > 50) {
          particles.push(new Particle(x, y, `rgb(${r},${g},${b})`));
        }
      }
    }

    loadingText.style.display = 'none';
    canvas.style.display = 'block';
    animate(img.width, img.height);
  }

  function animate(w, h) {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.update();
      p.draw();
    }
    requestAnimationFrame(() => animate(w, h));
  }

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  canvas.addEventListener('mouseleave', () => {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    mouse.x = touch.clientX - rect.left;
    mouse.y = touch.clientY - rect.top;
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => initParticles(img);
  img.onerror = () => {
    loadingText.textContent = 'Image failed to load — check your internet or replace IMG_SRC in the script.';
  };
  img.src = IMG_SRC;
</script>

</body>
</html>
